name: Forex Signal Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# CRITICAL FIX: prevents two runs from executing at the same time and
# racing to save trades_state.json, which was causing duplicate signals
# and silently lost trade updates (including missed SL notifications).
concurrency:
  group: forex-signal-scan
  cancel-in-progress: false   # queue overlapping runs instead of dropping them

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save trade state
        run: |
          git config user.name "forex-scanner-bot"
          git config user.email "actions@github.com"
          git pull --rebase
          git add trades_state.json
          git diff --staged --quiet || git commit -m "Update trade state [skip ci]"
          git push
